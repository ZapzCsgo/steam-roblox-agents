[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-roblox-agents"
version = "0.1.0"
description = "Multi-agent LangGraph pipeline that scores trending Steam games for Roblox adaptation, with traceability and offline evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matteo Murru", email = "contact@zapz.work" }]
dependencies = [
    "langgraph>=0.6",
    "langchain>=1.0",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
google = ["langchain-google-genai>=2"]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]
ollama = ["langchain-ollama>=0.3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
sra = "sra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sra"]
omit = ["src/sra/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["sra"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
