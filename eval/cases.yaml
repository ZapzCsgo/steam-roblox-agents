# Historical evaluation set: 21 Steam games that trended between 2020 and 2026, with what
# happened on Roblox afterwards. Source: recherche/02-historique-et-grille.md of the original
# project (research done on 2026-11-08, sources cited there).
#
# IMPORTANT: these cases were used to CALIBRATE grid v1.1 (weights, bonus, malus). This is
# not a blind test. It measures pipeline correctness, critic behaviour and reproducibility,
# not predictive power. See README "Evaluation".
#
# Fields
#   outcome      success | mixed | failure  (Roblox result after the Steam peak)
#   expected     verdict we want: success -> prototype, mixed -> watch, failure -> pass
#   reference    hand-assigned factor scores F1..F10 from the study (a posteriori)
#   ref_score    grid v1.1 score of the reference scores (backtest)
#   history      context at the Steam peak, reconstructed from the study:
#                peak_ccu (SteamCharts monthly peak), paid at the time, and the player count of an
#                established Roblox game already covering the genre (lower bound, 20000 = saturated)
#   tags         only when the Steam store item is no longer available

